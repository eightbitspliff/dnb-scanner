name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/dnb-scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dnb-scanner-apk
          path: out/dnb-scanner.apk

      - name: Versions-Release (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/dnb-scanner.apk

      - name: Release "latest" mit aktueller APK aktualisieren
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DnB Scanner (neuester Build)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automatisch gebaute APK vom Branch `${{ github.ref_name }}` (Commit ${{ github.sha }}).
            Direkter Download: https://github.com/${{ github.repository }}/releases/latest/download/dnb-scanner.apk
          files: out/dnb-scanner.apk
